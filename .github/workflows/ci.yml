name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 24
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Use npm 12
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify TypeScript transition layout
        run: |
          test "$(node -p "require('./node_modules/typescript/package.json').name")" = "@typescript/typescript6"
          ./node_modules/.bin/tsc --version
          ./node_modules/.bin/tsc6 --version

      - name: Typecheck
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test with coverage
        run: npm run test:cov

      - name: Test packed package
        run: npm run test:package

      - name: Check package type compatibility
        run: npm run test:attw

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          use_oidc: true
