name: Release to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm 12
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify release tag matches package version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected"

      - name: Resolve npm dist-tag
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) tag="${version#*-}"; tag="${tag%%+*}"; tag="${tag%%.*}" ;;
            *)   tag="latest" ;;
          esac

          if [ "$tag" = "latest" ] && [ "$IS_PRERELEASE" = "true" ]; then
            echo "::error::Release is marked as pre-release, but $version is a stable version"
            exit 1
          fi
          if [ "$tag" != "latest" ] && [ "$IS_PRERELEASE" != "true" ]; then
            echo "::error::$version is a prerelease version, but the GitHub Release is not marked as pre-release"
            exit 1
          fi
          case "$tag" in
            [0-9]*|v[0-9]*)
              echo "::error::dist-tag '$tag' looks like a version and npm will reject it; use a named prerelease identifier such as rc, next, or beta"
              exit 1 ;;
          esac

          echo "Publishing $version with dist-tag $tag"
          echo "NPM_DIST_TAG=$tag" >> "$GITHUB_ENV"

      - name: Validate source
        run: npm run check

      - name: Validate packed package
        run: npm run test:package

      - name: Check package type compatibility
        run: npm run test:attw

      - name: Publish package
        run: npm publish --provenance --access public --tag "$NPM_DIST_TAG"
